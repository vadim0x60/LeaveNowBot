name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: europe-west2
  SERVICE: leavenowbot
  REPOSITORY: leavenowbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check
      - run: uv run ruff format --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3

      - name: Provision infrastructure
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          STATE_BUCKET="${PROJECT_ID}-leavenowbot-tfstate"
          gcloud services enable storage.googleapis.com --project "${PROJECT_ID}"
          if ! gcloud storage buckets describe "gs://${STATE_BUCKET}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${STATE_BUCKET}" \
              --project "${PROJECT_ID}" \
              --location "${REGION}" \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://${STATE_BUCKET}" --versioning
          terraform -chdir=infra/bootstrap init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false
          terraform -chdir=infra/bootstrap apply \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -auto-approve \
            -input=false

      - name: Initialize application secrets
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN GitHub secret}"
          : "${GOOGLE_MAPS_API_KEY:?Missing GOOGLE_MAPS_API_KEY GitHub secret}"
          : "${TELEGRAM_WEBHOOK_SECRET:?Missing TELEGRAM_WEBHOOK_SECRET GitHub secret}"

          add_initial_version() {
            local name="$1" value="$2"
            if [[ -z "$(gcloud secrets versions list "${name}" \
              --project "${PROJECT_ID}" \
              --filter='state=ENABLED' \
              --limit=1 \
              --format='value(name)')" ]]; then
              printf %s "${value}" | gcloud secrets versions add "${name}" \
                --project "${PROJECT_ID}" \
                --data-file=-
            fi
          }

          add_initial_version leavenowbot-telegram-token "${TELEGRAM_BOT_TOKEN}"
          add_initial_version leavenowbot-maps-api-key "${GOOGLE_MAPS_API_KEY}"
          add_initial_version leavenowbot-webhook-secret "${TELEGRAM_WEBHOOK_SECRET}"

      - name: Build and push image
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy application
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
        run: |
          set -euo pipefail
          : "${ALLOWED_USER_IDS:?Missing ALLOWED_USER_IDS GitHub secret}"
          STATE_BUCKET="${PROJECT_ID}-leavenowbot-tfstate"
          terraform -chdir=infra/app init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false
          terraform -chdir=infra/app apply \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${IMAGE}" \
            -var="allowed_user_ids=${ALLOWED_USER_IDS}" \
            -auto-approve \
            -input=false
          SERVICE_URL="$(terraform -chdir=infra/app output -raw service_url)"
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

      - name: Verify deployment and register webhook
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "${SERVICE_URL%/}/healthz"
          python scripts/set_webhook.py --project "${PROJECT_ID}" --service-url "${SERVICE_URL}"
