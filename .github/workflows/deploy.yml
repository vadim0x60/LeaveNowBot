name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: europe-west2
  SERVICE: leavenowbot
  REPOSITORY: leavenowbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check
      - run: uv run ruff format --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3

      - name: Provision infrastructure
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          STATE_BUCKET="${PROJECT_ID}-leavenowbot-tfstate"
          gcloud services enable storage.googleapis.com --project "${PROJECT_ID}"
          if ! gcloud storage buckets describe "gs://${STATE_BUCKET}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${STATE_BUCKET}" \
              --project "${PROJECT_ID}" \
              --location "${REGION}" \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://${STATE_BUCKET}" --versioning
          terraform -chdir=infra/bootstrap init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false
          terraform -chdir=infra/bootstrap apply \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="github_repository=${GITHUB_REPOSITORY}" \
            -auto-approve \
            -input=false

      - name: Build and push image
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy application
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          STATE_BUCKET="${PROJECT_ID}-leavenowbot-tfstate"
          terraform -chdir=infra/app init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false
          terraform -chdir=infra/app apply \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${IMAGE}" \
            -auto-approve \
            -input=false
          SERVICE_URL="$(terraform -chdir=infra/app output -raw service_url)"
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

      - name: Verify deployment and register webhook
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "${SERVICE_URL%/}/healthz"
          python scripts/set_webhook.py --project "${PROJECT_ID}" --service-url "${SERVICE_URL}"
