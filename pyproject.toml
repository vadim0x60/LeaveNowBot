[project]
name = "leavenowbot"
version = "0.1.0"
description = "Telegram live-location transit departure reminders"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot[job-queue]>=22.5,<23", "httpx>=0.28,<0.29"]

[project.scripts]
leavenowbot = "leavenowbot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
